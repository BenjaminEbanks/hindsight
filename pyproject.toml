[project]
name = "hindsight"
version = "0.1.0"
description = "Background agents that redesign with the full picture"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sail-sdk>=0.17.2,<0.18",
]

[project.scripts]
hindsight = "hindsight.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight"]

[tool.pytest.ini_options]
# tests/contract creates real boxes, so it only runs when named.
testpaths = ["tests/unit"]
timeout = 120
